# Intégration continue commune aux dépôts de l'organisation.
#
# Les workflows ne s'héritent PAS automatiquement : chaque dépôt doit appeler
# celui-ci explicitement, avec un fichier .github/workflows/ci.yml contenant :
#
#   name: CI
#   on: [push, pull_request]
#   jobs:
#     ci:
#       uses: Sandbox-IA-FHU/.github/.github/workflows/reusable-python-ci.yml@main
#
# Les checks apparaissent alors sous les noms « qualite », « tests » et
# « donnees ». Si vous les rendez obligatoires dans un ruleset, attention :
# un check requis dont le nom ne correspond à aucun job n'est jamais satisfait,
# et la PR reste bloquée sans message clair. Renommer un job ici oblige à
# mettre à jour les rulesets de tous les dépôts.
#
# Pourquoi setup-uv est épinglé sur une version exacte et pas sur un tag
# majeur : astral-sh/setup-uv ne publie plus de tag majeur flottant au-delà de
# v7. « @v10 » n'existe pas et rend une erreur « unable to find version », qui
# fait échouer le job à la seconde étape, avant tout log utile. Vérifié le
# 2026-09-04 : dernière version publiée v10.0.1. Pour monter de version, aller
# lire les tags réellement publiés, ne pas deviner la forme du numéro.

name: CI Python (réutilisable)

on:
  workflow_call:
    inputs:
      version-python:
        description: Version de Python utilisée pour les jobs
        type: string
        default: "3.13"
      repertoire:
        description: Répertoire du projet, si le dépôt n'est pas à la racine
        type: string
        default: "."
      lancer-tests:
        description: Mettre à false pour un dépôt en exploration sans tests
        type: boolean
        default: true

jobs:
  qualite:
    name: qualite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.repertoire }}
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ inputs.version-python }}

      - name: Installer les dépendances
        run: |
          # --locked exige un uv.lock présent et à jour. Un dépôt en
          # exploration n'en a pas encore : le cycle de vie ne l'exige qu'au
          # statut actif. On avertit au lieu de bloquer, sinon tout dépôt
          # exploratoire aurait une CI rouge en permanence.
          if [ -f uv.lock ]; then
            uv sync --locked
          else
            echo "::warning::Pas de uv.lock : dépendances non figées. Exigé pour passer au statut actif, voir CYCLE-DE-VIE.md."
            uv sync
          fi

      - name: Lint
        run: uv run ruff check .

      - name: Formatage
        run: uv run ruff format --check .

  tests:
    name: tests
    if: ${{ inputs.lancer-tests }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.repertoire }}
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ inputs.version-python }}

      - name: Installer les dépendances
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked
          else
            echo "::warning::Pas de uv.lock : dépendances non figées. Exigé pour passer au statut actif, voir CYCLE-DE-VIE.md."
            uv sync
          fi

      - name: Tests
        run: uv run pytest
        env:
          # Aucun test ne doit dépendre d'un appel réseau à un fournisseur de
          # modèle : c'est lent, facturé, et non déterministe. Les appels sont
          # simulés. Une clé volontairement invalide fait échouer tout test qui
          # tenterait un vrai appel.
          ANTHROPIC_API_KEY: cle-invalide-pour-les-tests
          OPENAI_API_KEY: cle-invalide-pour-les-tests

  donnees:
    name: donnees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Aucun fichier d'environnement suivi
        run: |
          secrets=$(git ls-files '.env' '*/.env' '*.env' || true)
          if [ -n "$secrets" ]; then
            echo "::error::Des fichiers d'environnement sont suivis par Git."
            echo "$secrets"
            echo ""
            echo "Ils contiennent des clés. Voir SECURITY.md : révoquer les clés"
            echo "AVANT de nettoyer l'historique, et prévenir."
            exit 1
          fi
          echo "Aucun fichier d'environnement suivi."

      - name: Fichiers de données hors de la zone autorisée
        run: |
          # Un jeu d'évaluation est fait de données INVENTÉES et vit dans le
          # dépôt : evaluations/jeux/ est donc la seule zone où un fichier de
          # données a sa place. Partout ailleurs, il n'a rien à y faire.
          #
          # Filtrer par emplacement plutôt que par extension évite de refuser
          # un jeu d'évaluation légitime au format CSV — le plus naturel pour
          # ça — tout en gardant la règle stricte sur le reste du dépôt.
          hors_zone=$(git ls-files \
            '*.csv' '*.tsv' '*.parquet' '*.xlsx' '*.xls' \
            '*.db' '*.sqlite' '*.sqlite3' \
            | grep -v '^evaluations/jeux/' || true)
          if [ -n "$hors_zone" ]; then
            echo "::error::Fichiers de données hors de evaluations/jeux/ :"
            echo "$hors_zone"
            echo ""
            echo "Voir DONNEES.md. Un jeu d'évaluation inventé va dans"
            echo "evaluations/jeux/. Toute autre donnée reste hors du dépôt."
            echo "Retirer du suivi ne suffit pas : le fichier reste dans"
            echo "l'historique. Prévenir avant toute manipulation."
            exit 1
          fi
          echo "Aucun fichier de données hors zone."

      - name: Aucun fichier volumineux
        run: |
          # Le filtre par emplacement ne dit rien de ce qu'un fichier contient.
          # Le volume, si : un jeu de 300 cas inventés pèse quelques dizaines
          # de Ko. Au-delà de 5 Mo, c'est un export réel — y compris dans la
          # zone autorisée, et quelle que soit l'extension. C'est ce contrôle
          # qui rattrape un .json ou un .jsonl de données réelles, qu'un filtre
          # par extension laisserait passer.
          gros=$(git ls-files | while read -r f; do
            taille=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$taille" -gt 5242880 ]; then
              echo "$f ($((taille / 1048576)) Mo)"
            fi
          done)
          if [ -n "$gros" ]; then
            echo "::error::Fichiers de plus de 5 Mo suivis par Git :"
            echo "$gros"
            echo ""
            echo "Un jeu d'évaluation inventé ne pèse pas ça. Vérifier qu'il ne"
            echo "s'agit pas d'un export de données réelles. Si le fichier est"
            echo "légitime, en discuter avant de contourner."
            exit 1
          fi
          echo "Aucun fichier volumineux suivi."

      - name: Notebooks vidés de leurs sorties
        run: |
          echo "Un notebook commité contient les résultats affichés des cellules."
          restants=""
          for f in $(git ls-files '*.ipynb'); do
            if grep -q '"output_type"' "$f"; then
              restants="$restants $f"
            fi
          done
          if [ -n "$restants" ]; then
            echo "::error::Notebooks contenant des sorties :$restants"
            echo "Vider avec : uvx --from nbconvert jupyter-nbconvert --clear-output --inplace <fichier>"
            exit 1
          fi
          echo "Aucune sortie de notebook commitée."
